<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322" role="img" aria-label="Claude Haiku on httpx 0.28: stale calls before and after the fix"><rect x="0.5" y="0.5" width="759" height="321" rx="12" fill="#ffffff" stroke="#d1d9e0"/><text x="28" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#1f2328">Claude Haiku on httpx 0.28: stale calls before and after the fix</text><text x="28" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#59636e">10 samples per row. The snippet is five lines of httpx&#x27;s own CHANGELOG, picked by cutoff (no LLM).</text><text x="28" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2328">proxies=   before</text><rect x="300" y="97" width="321.7" height="26" rx="5" fill="#cf222e"/><text x="631.7" y="115" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">100%</text><text x="28" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2328" font-weight="600">proxies=   with snippet</text><rect x="300" y="141" width="2.0" height="26" rx="5" fill="#1a7f37"/><text x="312.0" y="159" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">0%</text><text x="28" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2328">verify=&lt;str&gt;   before</text><rect x="300" y="185" width="321.7" height="26" rx="5" fill="#cf222e"/><text x="631.7" y="203" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">100%</text><text x="28" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2328" font-weight="600">verify=&lt;str&gt;   with snippet</text><rect x="300" y="229" width="128.7" height="26" rx="5" fill="#bc4c00"/><text x="438.7" y="247" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">40%</text><text x="28" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">Raw outputs: examples/httpx/. The verify= fix helps but isn&#x27;t complete, and cutoff shows that too.</text></svg>
